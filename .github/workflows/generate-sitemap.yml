# This workflow runs the sitemap generator script daily and pushes changes to the current branch.
name: Generate and Update Sitemap

on:
  # push:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Copy .env file
        run: |
          if [ -f .env ]; then cp .env scripts/.env; fi

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Add XSL link to sitemap
        run: |
          sed -i '1 a <?xml-stylesheet type="text/xsl" href="/sitemap.xsl"?>' public/sitemap.xml
          
      - name: Commit and push sitemap changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/sitemap*.xml
          git commit -m 'chore: update sitemap.xml [auto]' || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload sitemap.xml to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/
          server-dir: /
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
